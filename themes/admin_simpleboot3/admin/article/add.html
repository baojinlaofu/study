<include file="public@header" />
</head>
<body>
	<div class="wrap">
		<ul class="nav nav-tabs">
			<li ><a href="{:url('Push/index')}">公告管理</a></li>
			<li class="active"><a >添加</a></li>
		</ul>
		<form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('Article/addPost')}">

            <div class="form-group">
				<label for="input-touid" class="col-sm-2 control-label"><span class="form-required">*</span>标题</label>
				<div class="col-md-6 col-sm-10">
					<textarea class="form-control" id="input-touid" name="article_name" ></textarea>
				</div>
			</div>
            
            <div class="form-group">
				<label for="input-content" class="col-sm-2 control-label"><span class="form-required">*</span>内容</label>
				<div class="col-md-6 col-sm-10">
					<textarea class="form-control" id="input-content" name="content" ></textarea>
				</div>
			</div>

	
            
			<div class="form-group">
				<div class="col-sm-offset-2 col-sm-10">
					<button type="submit" class="btn btn-primary js-ajax-submit">保存</button>
					<a class="btn btn-default" href="javascript:history.back(-1);">{:lang('BACK')}</a>
				</div>
			</div>
            
		</form>
	</div>
	<script src="__STATIC__/js/admin.js"></script>
</body>
</html>
